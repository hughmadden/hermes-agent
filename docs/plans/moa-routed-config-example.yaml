# Evidence-informed routed MoA config — every choice below is measured
# (docs/plans/moa-public-bench-results-20260703.md and the quality loop):
# Changes vs v1, each backed by a measured result:
# - router.classifier -> Cerebras gemma-4-31b paid key (100% acc, p50 288ms).
# - coding routes to open-kimi-solo, NOT open-moa-heavy: aider showed the MoA
#   fan-out HURTS precise code editing pass@1 (60% vs kimi solo 73.3%);
#   wafer-speed models can't edit either (gemma31 10%, glm-4.7 30% pass@1) —
#   kimi-class is the cheapest viable coding lane.
# - router.escalation: failure-gated escalation to a frontier lane gave full
#   frontier quality at ~25% of the frontier calls (aider 100% pass@2 with
#   3/30 exercises reaching Fable; SWE-bench 25/25 composite).
# - reference_max_tokens 600: -17% fan-out latency, same accuracy.
# - new cere-fast preset (all-Cerebras MoA, 38/40 @ 6.8s/task) is the default
#   fallback + general lane: near-max quality at interactive latency.
# - open-moa-heavy keeps the hard-reasoning lane (40/40 class on exact tasks).
# - self_answer stays on the classifier slot (wafer-speed trivial answers).
# Requires CEREBRAS_API_KEY in the serve container env.
providers:
  cerebras:
    api: https://api.cerebras.ai/v1
    name: cerebras
    default_model: gemma-4-31b
moa:
  save_traces: true
  default_preset: cere-fast
  slot_timeout_s: 300
  router:
    enabled: true
    classifier:
      provider: custom:cerebras
      model: gemma-4-31b
    default: cere-fast
    timeout_s: 8
    escalation:
      # Tiers escalate one step per NEW failure observation; min_failures
      # gates the first escalation (debugging workloads print tracebacks as
      # normal work — measured: first-failure escalation fired on 80% of SWE
      # conversations; min_failures=3 cut frontier turn share 33%->18% at
      # identical resolution). Match min_failures to the client's retry
      # depth: aider-style 2-attempt loops want 1-2; deep agentic loops 3+.
      tiers: [frontier-lane]
      min_failures: 3
  presets:
    frontier-opus-solo:
      enabled: false
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openrouter
        model: anthropic/claude-opus-4.8
      reference_max_tokens: 600
    frontier-gpt55-solo:
      enabled: false
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openrouter
        model: openai/gpt-5.5
      reference_max_tokens: 600
    open-deepseek-solo:
      enabled: false
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openrouter
        model: deepseek/deepseek-v4-pro
      reference_max_tokens: 600
    open-kimi-solo:
      route:
        description: writing or debugging code, software engineering, precise file edits, shell commands, refactors
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openrouter
        model: moonshotai/kimi-k2.6
      reference_max_tokens: 600
      enabled: false
    open-moa-heavy:
      route:
        description: hard reasoning, math, proofs, multi-step analysis where maximum accuracy matters more than speed
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: openrouter
          model: qwen/qwen3.7-max
        - provider: openrouter
          model: z-ai/glm-5.2
      aggregator:
        provider: openrouter
        model: moonshotai/kimi-k2.6
      reference_max_tokens: 600
    cere-fast:
      route:
        description: general knowledge, writing, summaries, everyday questions — everything that is not code, not hard math, and not trivial
      reference_models:
        - provider: custom:cerebras
          model: gpt-oss-120b
        - provider: custom:cerebras
          model: gemma-4-31b
      aggregator:
        provider: custom:cerebras
        model: zai-glm-4.7
      reference_max_tokens: 600
    open-moa-flash:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash
        - provider: openrouter
          model: qwen/qwen3.6-35b-a3b
        - provider: openrouter
          model: z-ai/glm-5.1
      aggregator:
        provider: openrouter
        model: deepseek/deepseek-v4-flash
      reference_max_tokens: 600
    frontier-lane:
      enabled: false
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openrouter
        model: anthropic/claude-fable-5
      reference_max_tokens: 600
    # Plan-covered frontier lane (measured: GPT-5.5 via the ChatGPT plan
    # through openai-codex = 95% HMMT / 80% SWE at $0 marginal). Requires the
    # live hermes auth.json mounted into the serve container; swap this in as
    # the escalation tier when plan quota is available.
    gpt55-plan-lane:
      enabled: false
      reference_models:
        - provider: openrouter
          model: unused/ref
      aggregator:
        provider: openai-codex
        model: gpt-5.5
      reference_max_tokens: 600
    open-moa-nano:
      reference_models:
        - provider: openrouter
          model: meta-llama/llama-3.1-8b-instruct
        - provider: openrouter
          model: mistralai/ministral-8b-2512
        - provider: openrouter
          model: google/gemma-3-12b-it
      aggregator:
        provider: openrouter
        model: google/gemma-3-27b-it
      reference_max_tokens: 600
    # THE FLAGSHIP LANE (measured 2026-07-04): consensus-gated cascade.
    # 93% AIME @ 4.4s median; 80% of requests answered at tier 0 (~3s wafer
    # consensus); frontier touched on 5% (plan-covered). Strictly dominates
    # always-on MoA aggregation on both AIME and HMMT.
    cascade-wafer4:
      mode: cascade
      cascade:
        escalate_to: gpt55-plan-lane
        min_consensus: 3
      reference_models:
        - provider: custom:cerebras
          model: gpt-oss-120b
        - provider: custom:cerebras
          model: gemma-4-31b
        - provider: custom:cerebras
          model: gpt-oss-120b
        - provider: custom:cerebras
          model: gemma-4-31b
      aggregator:
        provider: custom:cerebras
        model: zai-glm-4.7
      reference_max_tokens: 8000
      reference_quorum_grace: 0.8
